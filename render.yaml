services:
  - type: web
    name: church-command-center-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        generateValue: true
      - key: APP_URL
        sync: false
      - key: DB_CONNECTION
        fromDatabase:
          name: church-command-db
          property: connectionString
      - key: SESSION_DRIVER
        value: database
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: database
      - key: LOG_CHANNEL
        value: stack
      - key: LOG_LEVEL
        value: error
      - key: BROADCAST_CONNECTION
        value: reverb
      - key: REVERB_APP_KEY
        value: ejuiybupqt7gqtn6yh0d
      - key: REVERB_APP_SECRET
        value: cloud-secret-key-change-me
      - key: REVERB_APP_ID
        value: church-command-center
      - key: REVERB_HOST
        sync: false
      - key: REVERB_PORT
        value: "443"
      - key: REVERB_SCHEME
        value: https

databases:
  - name: church-command-db
    plan: free
    databaseName: church_command
    ipAllowList: []
